<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Earth to Mars - Scene 01: Launch Pad</title>
  <!-- Load A-Frame from CDN (v1.8.0 compatible) -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="js/launch.js"></script>
  <style>
    body { margin: 0; background: #0b0f19; font-family: sans-serif; color: #fff; }
    #hud-overlay {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 99; text-align: center; pointer-events: none;
    }
    .hud-title { font-size: 24px; font-weight: bold; color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,0.6); }
    .hud-sub { font-size: 14px; color: #a5b4fc; margin-top: 5px; }
  </style>
</head>
<body>

  <!-- On-Screen HUD Overlay -->
  <div id="hud-overlay">
    <div class="hud-title">01 Launch Pad</div>
    <div class="hud-sub">Press the LAUNCH button on the console to initiate ascent.</div>
  </div>

  <!-- A-Frame Scene -->
  <a-scene xr-mode-ui="enabled: true">

    <!-- Asset Management -->
    <a-assets>
      <audio id="liftoff-sound" src="assets/sounds/liftoff.mp3" preload="auto"></audio>
      <img id="earth-tex" src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_atmos_2048.jpg" crossorigin="anonymous">
      <img id="stars-tex" src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/cube/MilkyWay/dark-s_px.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- Camera & Rig with Cursor for VR / Mouse Interaction -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camera" look-controls>
        <a-cursor fuse="false" raycaster="objects: .clickable" material="color: #00e5ff; shader: flat"></a-cursor>
      </a-camera>
    </a-entity>

    <!-- Environment & Space Scenery -->
    <a-sky src="#stars-tex"></a-sky>

    <!-- Earth in the Distance -->
    <a-sphere src="#earth-tex" position="0 40 -120" radius="35" rotation="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 120000; easing: linear"></a-sphere>

    <!-- Launch Facility / Gantry Structure in Distance -->
    <a-entity position="0 -10 -45">
      <!-- Gantry Towers -->
      <a-box position="-12 15 0" width="1.5" height="40" depth="1.5" color="#1e293b"></a-box>
      <a-box position="12 15 0" width="1.5" height="40" depth="1.5" color="#1e293b"></a-box>
      <!-- Support Beams -->
      <a-box position="0 25 0" width="26" height="1" depth="1" color="#334155"></a-box>
      <a-box position="0 10 0" width="26" height="1" depth="1" color="#334155"></a-box>
    </a-entity>

    <!-- Rocket Cabin Interior (Matching Reference Aesthetic) -->
    <a-entity id="cabin" position="0 0 0">
      
      <!-- Cabin Floor & Ceiling -->
      <a-box position="0 -0.5 0" width="6" height="0.2" depth="6" color="#0f172a"></a-box>
      <a-box position="0 3.5 0" width="6" height="0.2" depth="6" color="#0f172a"></a-box>
      
      <!-- Back & Side Walls -->
      <a-box position="0 1.5 -3" width="6" height="4" depth="0.2" color="#1e293b"></a-box>
      <a-box position="-3 1.5 0" width="0.2" height="4" depth="6" color="#1e293b"></a-box>
      <a-box position="3 1.5 0" width="0.2" height="4" depth="6" color="#1e293b"></a-box>

      <!-- Glowing Vertical Neon Accents (Magenta/Purple & Cyan) -->
      <a-box position="-2.9 1.5 -1.5" width="0.05" height="3" depth="0.2" color="#c084fc" material="emissive: #c084fc; emissiveIntensity: 0.8"></a-box>
      <a-box position="2.9 1.5 -1.5" width="0.05" height="3" depth="0.2" color="#c084fc" material="emissive: #c084fc; emissiveIntensity: 0.8"></a-box>

      <!-- Main Control Console Desk -->
      <a-box position="0 0.8 -1.5" width="4.5" height="0.8" depth="1.2" color="#0f172a"></a-box>

      <!-- Flight System Panels (Displays) -->
      <!-- Left Panel -->
      <a-box position="-1.2 1.1 -1.4" rotation="-20 0 0" width="1.3" height="0.5" depth="0.05" color="#0891b2" material="emissive: #0e7490; emissiveIntensity: 0.5">
        <a-text value="FLIGHT SYSTEMS\nEARTH -> MARS" align="center" position="0 0 0.04" width="2" color="#ffffff"></a-text>
      </a-box>

      <!-- Right Panel -->
      <a-box position="1.2 1.1 -1.4" rotation="-20 0 0" width="1.3" height="0.5" depth="0.05" color="#0891b2" material="emissive: #0e7490; emissiveIntensity: 0.5">
        <a-text value="ENGINE STATUS\nNOMINAL" align="center" position="0 0 0.04" width="2" color="#ffffff"></a-text>
      </a-box>

      <!-- Interactive Launch Button -->
      <a-cylinder id="launch-btn" class="clickable" position="0 1.25 -1.3" radius="0.3" height="0.15" color="#c084fc" material="emissive: #a855f7; emissiveIntensity: 0.6" animation__hover="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200" animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200">
        <a-text value="LAUNCH" align="center" position="0 0.1 0" rotation="-90 0 0" width="1.5" color="#ffffff"></a-text>
      </a-cylinder>

      <!-- Smoke and Exhaust Particle Effect Emitters (Hidden until launch) -->
      <a-entity id="smoke-effects" position="0 -1 -2" visible="false">
        <a-sphere position="-0.8 0 0" radius="0.6" color="#94a3b8" material="opacity: 0.6; transparent: true;" animation="property: position; to: -1.5 -8 -2; dur: 2000; loop: true;"></a-sphere>
        <a-sphere position="0.8 0 0" radius="0.7" color="#94a3b8" material="opacity: 0.6; transparent: true;" animation="property: position; to: 1.5 -8 -2; dur: 2000; loop: true;"></a-sphere>
        <a-sphere position="0 -0.5 0.5" radius="0.9" color="#f97316" material="emissive: #ea580c; emissiveIntensity: 1; opacity: 0.8; transparent: true;" animation="property: position; to: 0 -10 1; dur: 1500; loop: true;"></a-sphere>
      </a-entity>

    </a-entity>

    <!-- Sound Component Entity -->
    <a-entity id="sound-emitter" sound="src: #liftoff-sound; volume: 1.0;"></a-entity>

  </a-scene>

</body>
</html>
