
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earth to Mars - Scene 05: Mars Landing</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="js/landing.js" defer></script>

  <style>
    body {
      margin: 0;
      background: #0b0f19;
      font-family: sans-serif;
      color: #fff;
    }

    #hud-overlay {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
      text-align: center;
      pointer-events: none;
      width: 90%;
    }

    .hud-title {
      font-size: 24px;
      font-weight: bold;
      color: #00e5ff;
      text-shadow: 0 0 10px rgba(0,229,255,0.6);
    }

    .hud-sub {
      font-size: 14px;
      color: #a5b4fc;
      margin-top: 5px;
    }

    #landing-ui {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      text-align: center;
    }

    #land-btn {
      padding: 16px 35px;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
      color: white;
      background: #7e22ce;
      border: 2px solid #c084fc;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px #a855f7;
      transition: all 0.2s ease;
    }

    #land-btn:hover {
      background: #a855f7;
      box-shadow: 0 0 35px #c084fc;
      transform: scale(1.05);
    }

    #land-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }
  </style>
</head>

<body>

  <!-- HUD -->
  <div id="hud-overlay">
    <div class="hud-title">05 Mars Landing</div>
    <div class="hud-sub">
      Prepare for descent onto the Martian surface.
    </div>
  </div>

  <!-- Landing Button -->
  <div id="landing-ui">
    <button id="land-btn">PRESS TO LAND</button>
  </div>

  <a-scene
    id="mars-landing-scene"
    xr-mode-ui="enabled: true"
    background="color: #351b22">

    <!-- Assets -->
    <a-assets>
      <audio
        id="landing-sound"
        src="assets/sounds/liftoff.mp3"
        preload="auto">
      </audio>

      <img
        id="mars-tex"
        src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/mars_1k_color.jpg"
        crossorigin="anonymous">

      <img
        id="stars-tex"
        src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/cube/MilkyWay/dark-s_px.jpg"
        crossorigin="anonymous">
    </a-assets>

    <!-- Space Sky -->
    <a-sky
      id="space-sky"
      src="#stars-tex">
    </a-sky>

    <!-- Mars in the distance -->
    <a-sphere
      id="mars-planet"
      src="#mars-tex"
      position="0 35 -120"
      radius="35"
      rotation="0 0 0"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 120000; easing: linear">
    </a-sphere>

    <!-- Mars Horizon -->
    <a-entity id="mars-landscape">

      <!-- Ground -->
      <a-plane
        position="0 0 -20"
        rotation="-90 0 0"
        width="500"
        height="500"
        color="#9c4935">
      </a-plane>

      <!-- Distant terrain -->
      <a-sphere
        position="-30 -3 -60"
        radius="20"
        scale="2 0.5 1"
        color="#7c3026">
      </a-sphere>

      <a-sphere
        position="35 -4 -70"
        radius="25"
        scale="1.5 0.5 1"
        color="#8b3a2b">
      </a-sphere>

      <!-- Rocks -->
      <a-sphere
        position="-12 0 -15"
        radius="2"
        scale="1.5 0.6 1"
        color="#6b2b23">
      </a-sphere>

      <a-sphere
        position="12 0 -20"
        radius="2.5"
        scale="1 0.7 1.2"
        color="#a34e38">
      </a-sphere>

      <a-sphere
        position="18 0 -8"
        radius="1.5"
        scale="1.2 0.6 1"
        color="#6b2b23">
      </a-sphere>

    </a-entity>

    <!-- Player spacecraft rig -->
    <a-entity id="rig" position="0 35 0">

      <!-- Camera -->
      <a-camera
        id="camera"
        position="0 1.6 0"
        look-controls>

        <a-cursor
          fuse="false"
          raycaster="objects: .clickable"
          material="color: #00e5ff; shader: flat">
        </a-cursor>

      </a-camera>

      <!-- Cockpit cabin -->
      <a-entity id="cabin">

        <!-- Floor -->
        <a-box
          position="0 0 0"
          width="6"
          height="0.2"
          depth="6"
          color="#0f172a">
        </a-box>

        <!-- Ceiling -->
        <a-box
          position="0 3.5 0"
          width="6"
          height="0.2"
          depth="6"
          color="#0f172a">
        </a-box>

        <!-- Rear wall -->
        <a-box
          position="0 1.8 3"
          width="6"
          height="3.6"
          depth="0.2"
          color="#1e293b">
        </a-box>

        <!-- Side walls -->
        <a-box
          position="-3 1.8 0"
          width="0.2"
          height="3.6"
          depth="6"
          color="#1e293b">
        </a-box>

        <a-box
          position="3 1.8 0"
          width="0.2"
          height="3.6"
          depth="6"
          color="#1e293b">
        </a-box>

        <!-- Neon accents -->
        <a-box
          position="-2.9 1.8 -1.5"
          width="0.05"
          height="3"
          depth="0.2"
          color="#c084fc"
          material="emissive: #c084fc; emissiveIntensity: 0.8">
        </a-box>

        <a-box
          position="2.9 1.8 -1.5"
          width="0.05"
          height="3"
          depth="0.2"
          color="#00e5ff"
          material="emissive: #00e5ff; emissiveIntensity: 0.8">
        </a-box>

        <!-- Console -->
        <a-box
          position="0 0.8 -1.5"
          width="4.5"
          height="0.8"
          depth="1.2"
          color="#0f172a">
        </a-box>

        <!-- Flight display -->
        <a-box
          position="-1.2 1.3 -1.5"
          rotation="-20 0 0"
          width="1.3"
          height="0.5"
          depth="0.05"
          color="#0891b2"
          material="emissive: #0e7490; emissiveIntensity: 0.5">

          <a-text
            value="MARS APPROACH&#10;LANDING SYSTEM"
            align="center"
            position="0 0 0.04"
            width="2"
            color="#ffffff">
          </a-text>
        </a-box>

        <!-- Engine status display -->
        <a-box
          position="1.2 1.3 -1.5"
          rotation="-20 0 0"
          width="1.3"
          height="0.5"
          depth="0.05"
          color="#0891b2"
          material="emissive: #0e7490; emissiveIntensity: 0.5">

          <a-text
            value="ENGINE STATUS&#10;DESCENDING"
            align="center"
            position="0 0 0.04"
            width="2"
            color="#ffffff">
          </a-text>
        </a-box>

        <!-- Landing effects -->
        <a-entity
          id="landing-effects"
          position="0 -1 -2"
          visible="false">

          <a-sphere
            position="-1 0 0"
            radius="0.8"
            color="#d6b4a8"
            material="opacity: 0.5; transparent: true"
            animation="property: position; to: -4 0 -2; dur: 1500; loop: true">
          </a-sphere>

          <a-sphere
            position="1 0 0"
            radius="0.8"
            color="#d6b4a8"
            material="opacity: 0.5; transparent: true"
            animation="property: position; to: 4 0 -2; dur: 1500; loop: true">
          </a-sphere>

          <a-sphere
            position="0 -1 0"
            radius="0.6"
            color="#f97316"
            material="emissive: #ea580c; emissiveIntensity: 1"
            animation="property: position; to: 0 -5 1; dur: 1200; loop: true">
          </a-sphere>

        </a-entity>

      </a-entity>

    </a-entity>

    <!-- Sound -->
    <a-entity
      id="sound-emitter"
      sound="src: #landing-sound; volume: 1">
    </a-entity>

  </a-scene>

</body>
</html>
